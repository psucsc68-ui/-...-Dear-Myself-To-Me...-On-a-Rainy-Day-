<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ถึงฉัน... ในวันที่ฝนตก (Dear Myself : To Me... On a Rainy Day)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Prompt & Mitr -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&family=Prompt:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 40%, #f0f9ff 100%);
            color: #1e293b;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
        }

        .font-header {
            font-family: 'Mitr', sans-serif;
        }

        /* Soft Bright Glassmorphism */
        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 30px -5px rgba(186, 230, 253, 0.4), 0 4px 12px 0 rgba(14, 165, 233, 0.08);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(186, 230, 253, 0.8);
            backdrop-filter: blur(8px);
        }

        .glass-input:focus {
            background: #ffffff;
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
            outline: none;
        }

        /* Keyframes for falling rain messages */
        @keyframes fall {
            0% {
                transform: translateY(-120px) scale(0.9);
                opacity: 0;
            }
            15% {
                opacity: 1;
                transform: translateY(0px) scale(1);
            }
            85% {
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) scale(0.95);
                opacity: 0;
            }
        }

        .falling-item {
            position: absolute;
            will-change: transform, opacity;
            animation: fall linear infinite;
            cursor: pointer;
            transition: filter 0.3s ease, transform 0.2s ease;
        }

        .falling-item:hover {
            animation-play-state: paused;
            filter: scale(1.08);
            z-index: 50 !important;
        }

        /* Floating Animation for Umbrella */
        @keyframes umbrellaFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }

        .umbrella-float {
            animation: umbrellaFloat 4s ease-in-out infinite;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(224, 242, 254, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.4);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(14, 165, 233, 0.7);
        }
    </style>
</head>
<body class="min-h-screen relative overflow-hidden flex flex-col justify-between">

    <!-- Background Canvas for Soft Rain Drops -->
    <canvas id="rainCanvas" class="fixed inset-0 pointer-events-none z-0"></canvas>
    
    <!-- Ambient Soft Glow Background Clouds -->
    <div class="fixed top-[-10%] left-[-10%] w-[500px] h-[500px] bg-white/60 rounded-full blur-[100px] pointer-events-none"></div>
    <div class="fixed bottom-[-5%] right-[-5%] w-[450px] h-[450px] bg-sky-200/50 rounded-full blur-[90px] pointer-events-none"></div>

    <!-- Header Navigation -->
    <header class="relative z-20 flex justify-between items-center p-4 md:p-6 max-w-6xl mx-auto w-full">
        <div class="flex items-center space-x-3">
            <div class="w-11 h-11 bg-white/80 rounded-2xl border border-sky-200 shadow-sm flex items-center justify-center text-sky-500 umbrella-float">
                <!-- Cute SVG Umbrella Icon -->
                <svg class="w-6 h-6 fill-current text-sky-500" viewBox="0 0 24 24">
                    <path d="M12,2A10,10 0 0,0 2,12C2,12.28 2.04,12.55 2.1,12.82C2.71,12.31 3.8,12 5,12C6.83,12 8.35,12.7 9.1,13.72C9.85,12.7 11.37,12 13.2,12 C15,12 16.53,12.7 17.28,13.72C18.03,12.7 19.55,12 21.38,12C22.2,12 22.95,12.15 23.56,12.42C23.85,12.28 24,12.14 24,12A10,10 0 0,0 12,2M11,14.08V20A2,2 0 0,1 9,22A2,2 0 0,1 7,20I" />
                    <path d="M12 2a10 10 0 0 0-10 10c0 .28.04.55.1.82 1.13-.93 2.7-1.42 4.4-1.42 2.1 0 3.88.85 4.8 2.15.92-1.3 2.7-2.15 4.8-2.15 2.1 0 3.88.85 4.8 2.15.92-1.3 2.7-2.15 4.8-2.15.82 0 1.57.15 2.18.42.29-.14.44-.28.44-.42A10 10 0 0 0 12 2zm-1 12.08V20a2 2 0 0 1-4 0h-2a4 4 0 0 0 8 0v-5.92c-.32-.05-.66-.08-1-.08s-.68.03-1 .08z" fill="#0284c7"/>
                </svg>
            </div>
            <div>
                <h1 class="font-header text-lg md:text-xl font-medium tracking-wide text-slate-800">ถึงฉัน... ในวันที่ฝนตก</h1>
                <p class="text-xs text-sky-600/80 font-light">Dear Myself : To Me... On a Rainy Day</p>
            </div>
        </div>

        <!-- Controls: Audio Toggle & Gallery Opener -->
        <div class="flex items-center space-x-2 md:space-x-3">
            <button id="audioBtn" class="glass-panel hover:bg-white text-sky-800 px-3 py-2 rounded-2xl text-xs md:text-sm flex items-center space-x-2 transition shadow-sm border border-white">
                <i id="audioIcon" class="fa-solid fa-volume-xmark text-slate-400"></i>
                <span id="audioText" class="hidden sm:inline">เสียงฝนตก</span>
            </button>
            <button id="openGalleryBtn" class="glass-panel hover:bg-white text-sky-800 px-3.5 py-2 rounded-2xl text-xs md:text-sm flex items-center space-x-2 transition shadow-sm border border-white">
                <i class="fa-solid fa-box-archive text-sky-500"></i>
                <span class="hidden sm:inline">คลังสายฝน</span>
                <span id="msgCountBadge" class="bg-sky-500 text-white text-[11px] px-2 py-0.5 rounded-full font-medium shadow-sm">0</span>
            </button>
        </div>
    </header>

    <!-- Main Dynamic Rain Area -->
    <main id="rainContainer" class="fixed inset-0 z-10 pointer-events-none overflow-hidden">
        <!-- Interactive Protective Umbrella Graphic in background center -->
        <div id="umbrellaShield" class="absolute bottom-28 left-1/2 -translate-x-1/2 pointer-events-auto cursor-grab active:cursor-grabbing transition-transform duration-100 hidden md:flex flex-col items-center opacity-85 hover:opacity-100">
            <div class="bg-sky-500/10 backdrop-blur-md px-3 py-1 rounded-full border border-sky-300/40 text-[11px] text-sky-700 mb-2 shadow-sm animate-pulse">
                ☂️ ร่มกางปกป้องหัวใจคุณอยู่นะ
            </div>
            <svg class="w-48 h-36 drop-shadow-xl" viewBox="0 0 100 80" fill="none">
                <!-- Umbrella Canopy -->
                <path d="M50 10 C20 10, 5 35, 5 45 C15 42, 25 46, 35 42 C45 46, 55 46, 65 42 C75 46, 85 42, 95 45 C95 35, 80 10, 50 10 Z" fill="#ffffff" fill-opacity="0.85" stroke="#0284c7" stroke-width="2"/>
                <path d="M50 10 C35 25, 35 35, 35 42" stroke="#bae6fd" stroke-width="1.5" stroke-dasharray="2 2"/>
                <path d="M50 10 C65 25, 65 35, 65 42" stroke="#bae6fd" stroke-width="1.5" stroke-dasharray="2 2"/>
                <!-- Umbrella Tip & Handle -->
                <path d="M50 6 L50 10" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M50 45 L50 68 C50 72, 44 72, 44 68" stroke="#0284c7" stroke-width="3" stroke-linecap="round" fill="none"/>
            </svg>
        </div>
    </main>

    <!-- Bottom Interactive Input Form -->
    <div class="relative z-20 max-w-xl mx-auto w-full px-4 pb-6 pt-2">
        <div class="glass-panel p-4 md:p-5 rounded-3xl border border-white/90 shadow-xl relative">
            <form id="messageForm" class="space-y-3">
                <div class="flex items-center justify-between text-xs text-sky-900/80 font-medium px-1">
                    <label for="messageInput" class="flex items-center gap-1.5">
                        <i class="fa-solid fa-umbrella text-sky-500"></i> เขียนข้อความส่งถึงตัวเองในวันที่ฝนตก...
                    </label>
                    <span id="charCount" class="text-slate-400 font-normal">0/150</span>
                </div>

                <textarea id="messageInput" rows="2" maxlength="150" required
                    placeholder="วันนี้เหนื่อยไหม... กอดตัวเองนะ ไม่ว่าฝนจะตกหนักแค่ไหน เดี๋ยวท้องฟ้าก็สดใสขึ้น..." 
                    class="w-full glass-input rounded-2xl p-3.5 text-sm text-slate-800 placeholder-slate-400 focus:ring-2 focus:ring-sky-300/60 resize-none transition duration-200"></textarea>

                <!-- Mood Selector Tags -->
                <div class="flex flex-wrap items-center justify-between gap-2 pt-1">
                    <div class="flex flex-wrap gap-1.5" id="moodContainer">
                        <!-- Mood Options dynamically rendered via JS -->
                    </div>

                    <button type="submit" 
                        class="bg-gradient-to-r from-sky-400 to-blue-500 hover:from-sky-500 hover:to-blue-600 text-white font-medium text-xs md:text-sm px-5 py-2.5 rounded-2xl transition duration-300 transform active:scale-95 shadow-md shadow-sky-300/50 flex items-center space-x-2 ml-auto">
                        <i class="fa-solid fa-umbrella text-xs"></i>
                        <span>ปล่อยลงสายฝน</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Read Message Modal Dialog (Soft Umbrella Card) -->
    <div id="readModal" class="fixed inset-0 z-50 bg-slate-900/30 backdrop-blur-md flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="glass-panel max-w-md w-full rounded-3xl p-6 border border-white shadow-2xl relative transform scale-95 transition-transform duration-300 bg-white/90" id="readModalCard">
            <button id="closeModalBtn" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 transition w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <!-- Umbrella Watermark Background Header -->
            <div class="text-center mb-3">
                <div class="w-12 h-12 bg-sky-100 text-sky-500 rounded-2xl mx-auto flex items-center justify-center text-xl shadow-inner mb-2">
                    <i class="fa-solid fa-umbrella"></i>
                </div>
                <div class="flex items-center justify-center space-x-2">
                    <span id="modalMoodBadge" class="text-xs px-3 py-1 rounded-full font-medium">
                        🤍 กอดตัวเอง
                    </span>
                    <span id="modalTime" class="text-xs text-slate-400">เมื่อสักครู่นี้</span>
                </div>
            </div>

            <div class="p-5 bg-sky-50/60 rounded-2xl border border-sky-100 my-4 min-h-[110px] flex items-center justify-center text-center shadow-inner">
                <p id="modalContent" class="text-base md:text-lg text-slate-700 font-light leading-relaxed font-header">
                    "ข้อความจะแสดงตรงนี้"
                </p>
            </div>

            <div class="flex items-center justify-between pt-1 text-xs text-slate-500">
                <span class="flex items-center gap-1"><i class="fa-solid fa-heart-pulse text-sky-400"></i> ข้อความปกป้องหัวใจ</span>
                <button id="likeBtn" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-500 border border-rose-200/60 transition font-medium">
                    <i class="fa-regular fa-heart" id="likeIcon"></i>
                    <span id="likeCount">0</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Gallery Modal (Rain Log) -->
    <div id="galleryModal" class="fixed inset-0 z-50 bg-slate-900/30 backdrop-blur-md flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="glass-panel max-w-2xl w-full h-[80vh] rounded-3xl p-6 border border-white shadow-2xl flex flex-col relative bg-white/90">
            <div class="flex items-center justify-between pb-4 border-b border-sky-100">
                <div class="flex items-center space-x-2.5">
                    <div class="w-8 h-8 rounded-xl bg-sky-100 text-sky-600 flex items-center justify-center">
                        <i class="fa-solid fa-box-archive text-sm"></i>
                    </div>
                    <h2 class="text-lg font-header font-medium text-slate-800">คลังข้อความในสายฝน</h2>
                </div>
                <button id="closeGalleryBtn" class="text-slate-400 hover:text-slate-700 transition w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Messages List -->
            <div id="galleryList" class="flex-1 overflow-y-auto py-4 space-y-3 pr-1">
                <!-- Gallery items populated by JS -->
            </div>

            <div class="pt-3 border-t border-sky-100 text-xs text-center text-slate-400 font-light flex items-center justify-center gap-1">
                <i class="fa-solid fa-umbrella text-sky-400"></i> ให้ร่มคันนี้ช่วยปกป้องความรู้สึกของคุณในทุกๆ วันฝนตก
            </div>
        </div>
    </div>

    <script>
        /* ----------------------------------------------------
         * 1. PRE-LOADED DATA & MOOD CONFIGURATIONS (Soft Sky Theme)
         * ---------------------------------------------------- */
        const MOODS = [
            { id: 'hug', label: '🤍 กอดตัวเอง', bg: 'bg-sky-50', border: 'border-sky-300', text: 'text-sky-700', badgeBg: 'bg-sky-100' },
            { id: 'release', label: '🍃 ปล่อยวาง', bg: 'bg-teal-50', border: 'border-teal-300', text: 'text-teal-700', badgeBg: 'bg-teal-100' },
            { id: 'tired', label: '🌧️ เหนื่อยจัง', bg: 'bg-slate-50', border: 'border-slate-300', text: 'text-slate-700', badgeBg: 'bg-slate-200' },
            { id: 'hope', label: '🌱 ความหวัง', bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-700', badgeBg: 'bg-emerald-100' },
            { id: 'miss', label: '💭 คิดถึง', bg: 'bg-indigo-50', border: 'border-indigo-300', text: 'text-indigo-700', badgeBg: 'bg-indigo-100' }
        ];

        const INITIAL_MESSAGES = [
            { text: "กางร่มให้หัวใจตัวเองบ้างนะ ไม่ต้องแบกรับทุกอย่างไว้คนเดียว", mood: "hug", likes: 18, time: "เมื่อสักครู่" },
            { text: "ฝนตกซาลงเมื่อไหร่ รุ้งกินน้ำงามๆ จะมาทักทายแน่นอน", mood: "hope", likes: 29, time: "5 นาทีที่แล้ว" },
            { text: "ถ้าวันนี้เหนื่อยเกินไป ถอนหายใจยาวๆ แล้วพักผ่อนนะ", mood: "tired", likes: 12, time: "8 นาทีที่แล้ว" },
            { text: "ปล่อยความเศร้าไหลไปกับหยดฝน แล้วเริ่มต้นใหม่ในวันพรุ่งนี้", mood: "release", likes: 24, time: "14 นาทีที่แล้ว" },
            { text: "คิดถึงรอยยิ้มสดใสของตัวเองในวันที่แดดออกจัง", mood: "miss", likes: 15, time: "20 นาทีที่แล้ว" }
        ];

        let messagesList = [...INITIAL_MESSAGES];
        let selectedMood = MOODS[0].id;
        let currentActiveItem = null;

        /* ----------------------------------------------------
         * 2. SOFT BLUE RAIN CANVAS ANIMATION
         * ---------------------------------------------------- */
        const canvas = document.getElementById('rainCanvas');
        const ctx = canvas.getContext('2d');
        let raindrops = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class RainDrop {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -canvas.height;
                this.length = Math.random() * 18 + 8;
                this.speed = Math.random() * 8 + 4;
                this.opacity = Math.random() * 0.4 + 0.2;
            }
            update() {
                this.y += this.speed;
                if (this.y > canvas.height) {
                    this.reset();
                }
            }
            draw() {
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - 0.5, this.y + this.length);
                ctx.strokeStyle = `rgba(56, 189, 248, ${this.opacity})`;
                ctx.lineWidth = 1.2;
                ctx.stroke();
            }
        }

        for (let i = 0; i < 75; i++) {
            raindrops.push(new RainDrop());
        }

        function animateRain() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            raindrops.forEach(drop => {
                drop.update();
                drop.draw();
            });
            requestAnimationFrame(animateRain);
        }
        animateRain();

        /* ----------------------------------------------------
         * 3. WEB AUDIO API - SOOTHING RAIN SYNTHESIZER
         * ---------------------------------------------------- */
        let audioCtx = null;
        let isAudioPlaying = false;
        let rainNoiseNode = null;

        function toggleRainSound() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (isAudioPlaying) {
                if (rainNoiseNode) rainNoiseNode.disconnect();
                isAudioPlaying = false;
                document.getElementById('audioIcon').className = 'fa-solid fa-volume-xmark text-slate-400';
                document.getElementById('audioText').textContent = 'เสียงฝนตก';
            } else {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                
                const bufferSize = audioCtx.sampleRate * 2;
                const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                
                let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
                for (let i = 0; i < bufferSize; i++) {
                    let white = Math.random() * 2 - 1;
                    b0 = 0.99886 * b0 + white * 0.0555179;
                    b1 = 0.99332 * b1 + white * 0.0750759;
                    b2 = 0.96900 * b2 + white * 0.1538520;
                    b3 = 0.86650 * b3 + white * 0.3104856;
                    b4 = 0.55000 * b4 + white * 0.5329522;
                    b5 = -0.7616 * b5 - white * 0.0168980;
                    output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                    output[i] *= 0.025; // Gentle volume
                    b6 = white * 0.115926;
                }

                const whiteNoise = audioCtx.createBufferSource();
                whiteNoise.buffer = noiseBuffer;
                whiteNoise.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 750;

                whiteNoise.connect(filter);
                filter.connect(audioCtx.destination);
                whiteNoise.start();

                rainNoiseNode = whiteNoise;
                isAudioPlaying = true;

                document.getElementById('audioIcon').className = 'fa-solid fa-volume-high text-sky-500';
                document.getElementById('audioText').textContent = 'ปิดเสียงฝน';
            }
        }

        document.getElementById('audioBtn').addEventListener('click', toggleRainSound);

        /* ----------------------------------------------------
         * 4. MOOD SELECTION & INPUT HANDLERS
         * ---------------------------------------------------- */
        const moodContainer = document.getElementById('moodContainer');

        MOODS.forEach((m, idx) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = `text-xs px-2.5 py-1 rounded-xl border transition-all duration-200 flex items-center space-x-1 ${
                idx === 0 
                ? `${m.border} ${m.bg} ${m.text} font-medium shadow-sm scale-105` 
                : 'border-slate-200/80 bg-white/60 text-slate-600 hover:bg-white'
            }`;
            btn.setAttribute('data-id', m.id);
            btn.innerHTML = `<span>${m.label}</span>`;
            
            btn.addEventListener('click', () => {
                selectedMood = m.id;
                Array.from(moodContainer.children).forEach(child => {
                    const cId = child.getAttribute('data-id');
                    const cMood = MOODS.find(item => item.id === cId);
                    child.className = `text-xs px-2.5 py-1 rounded-xl border transition-all duration-200 flex items-center space-x-1 ${
                        cId === selectedMood 
                        ? `${cMood.border} ${cMood.bg} ${cMood.text} font-medium shadow-sm scale-105` 
                        : 'border-slate-200/80 bg-white/60 text-slate-600 hover:bg-white'
                    }`;
                });
            });

            moodContainer.appendChild(btn);
        });

        const messageInput = document.getElementById('messageInput');
        const charCount = document.getElementById('charCount');

        messageInput.addEventListener('input', (e) => {
            charCount.textContent = `${e.target.value.length}/150`;
        });

        /* ----------------------------------------------------
         * 5. FALLING UMBRELLA-DROP MESSAGES ENGINE
         * ---------------------------------------------------- */
        const rainContainer = document.getElementById('rainContainer');

        function createFallingMessage(data) {
            const moodObj = MOODS.find(m => m.id === data.mood) || MOODS[0];
            
            const el = document.createElement('div');
            el.className = `falling-item pointer-events-auto glass-panel px-4 py-3 rounded-2xl border ${moodObj.border} bg-white/80 shadow-md max-w-[230px] sm:max-w-[290px]`;
            
            const startLeft = Math.random() * 75 + 8; // 8% to 83%
            const duration = Math.random() * 10 + 18; // 18s to 28s slow soothing speed
            const delay = Math.random() * 2;

            el.style.left = `${startLeft}%`;
            el.style.animationDuration = `${duration}s`;
            el.style.animationDelay = `${delay}s`;
            el.style.zIndex = Math.floor(Math.random() * 20) + 10;

            const displayText = data.text.length > 36 ? data.text.substring(0, 36) + '...' : data.text;

            el.innerHTML = `
                <div class="flex items-center justify-between gap-1 mb-1.5">
                    <span class="text-[10px] px-2 py-0.5 rounded-full ${moodObj.badgeBg} ${moodObj.text} font-medium flex items-center gap-1">
                        <i class="fa-solid fa-umbrella text-[9px]"></i> ${moodObj.label}
                    </span>
                    <span class="text-[10px] text-slate-400"><i class="fa-regular fa-heart"></i> ${data.likes || 0}</span>
                </div>
                <p class="text-xs text-slate-700 font-light leading-relaxed">${displayText}</p>
            `;

            el.addEventListener('click', () => {
                openReadModal(data, moodObj);
            });

            rainContainer.appendChild(el);

            setTimeout(() => {
                if (el && el.parentNode) {
                    el.remove();
                }
            }, (duration + delay) * 1000);
        }

        // Loop to continuously spawn raindrops
        let spawnIndex = 0;
        function startRainLoop() {
            setInterval(() => {
                if (messagesList.length > 0) {
                    const msgData = messagesList[spawnIndex % messagesList.length];
                    createFallingMessage(msgData);
                    spawnIndex++;
                }
            }, 3800);
        }

        INITIAL_MESSAGES.forEach((msg, i) => {
            setTimeout(() => createFallingMessage(msg), i * 1400);
        });

        startRainLoop();

        /* ----------------------------------------------------
         * 6. READING MODAL & LIKE SYSTEM
         * ---------------------------------------------------- */
        const readModal = document.getElementById('readModal');
        const readModalCard = document.getElementById('readModalCard');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalContent = document.getElementById('modalContent');
        const modalMoodBadge = document.getElementById('modalMoodBadge');
        const modalTime = document.getElementById('modalTime');
        const likeBtn = document.getElementById('likeBtn');
        const likeIcon = document.getElementById('likeIcon');
        const likeCount = document.getElementById('likeCount');

        function openReadModal(data, moodObj) {
            currentActiveItem = data;
            modalContent.textContent = `"${data.text}"`;
            modalMoodBadge.textContent = moodObj.label;
            modalMoodBadge.className = `text-xs px-3 py-1 rounded-full font-medium ${moodObj.badgeBg} ${moodObj.text} border ${moodObj.border}`;
            modalTime.textContent = data.time || 'เมื่อสักครู่นี้';
            likeCount.textContent = data.likes || 0;
            
            likeIcon.className = "fa-regular fa-heart";
            likeBtn.classList.remove('text-rose-600', 'bg-rose-100');

            readModal.classList.remove('opacity-0', 'pointer-events-none');
            readModalCard.classList.remove('scale-95');
            readModalCard.classList.add('scale-100');
        }

        function closeReadModal() {
            readModal.classList.add('opacity-0', 'pointer-events-none');
            readModalCard.classList.remove('scale-100');
            readModalCard.classList.add('scale-95');
        }

        closeModalBtn.addEventListener('click', closeReadModal);
        readModal.addEventListener('click', (e) => {
            if (e.target === readModal) closeReadModal();
        });

        likeBtn.addEventListener('click', () => {
            if (currentActiveItem) {
                if (likeIcon.classList.contains('fa-regular')) {
                    likeIcon.className = "fa-solid fa-heart text-rose-500 animate-bounce";
                    likeBtn.classList.add('bg-rose-100');
                    currentActiveItem.likes = (currentActiveItem.likes || 0) + 1;
                    likeCount.textContent = currentActiveItem.likes;
                    updateGalleryBadge();
                }
            }
        });

        /* ----------------------------------------------------
         * 7. SUBMITTING NEW RAIN NOTE
         * ---------------------------------------------------- */
        const messageForm = document.getElementById('messageForm');

        messageForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            const newMsg = {
                text: text,
                mood: selectedMood,
                likes: 1,
                time: "เมื่อสักครู่นี้"
            };

            messagesList.unshift(newMsg);
            createFallingMessage(newMsg);

            messageInput.value = '';
            charCount.textContent = '0/150';
            updateGalleryBadge();

            showToast('ส่งข้อความลงในสายฝนใต้ร่มเรียบร้อยแล้วค่ะ ☂️💙');
        });

        /* ----------------------------------------------------
         * 8. GALLERY LOG SYSTEM
         * ---------------------------------------------------- */
        const galleryModal = document.getElementById('galleryModal');
        const openGalleryBtn = document.getElementById('openGalleryBtn');
        const closeGalleryBtn = document.getElementById('closeGalleryBtn');
        const galleryList = document.getElementById('galleryList');
        const msgCountBadge = document.getElementById('msgCountBadge');

        function updateGalleryBadge() {
            msgCountBadge.textContent = messagesList.length;
        }
        updateGalleryBadge();

        function renderGallery() {
            galleryList.innerHTML = '';
            
            if (messagesList.length === 0) {
                galleryList.innerHTML = `
                    <div class="text-center py-12 text-slate-400">
                        <i class="fa-solid fa-umbrella text-3xl mb-2 text-sky-200"></i>
                        <p class="text-sm">ยังไม่มีข้อความ บันทึกความรู้สึกของคุณเป็นคนแรกได้เลยนะ</p>
                    </div>
                `;
                return;
            }

            messagesList.forEach((msg) => {
                const moodObj = MOODS.find(m => m.id === msg.mood) || MOODS[0];
                const card = document.createElement('div');
                card.className = `p-4 rounded-2xl border ${moodObj.border} ${moodObj.bg} transition space-y-2 shadow-sm`;
                
                card.innerHTML = `
                    <div class="flex items-center justify-between text-xs">
                        <span class="${moodObj.text} font-medium flex items-center gap-1">
                            <i class="fa-solid fa-umbrella text-[10px]"></i> ${moodObj.label}
                        </span>
                        <span class="text-slate-400">${msg.time}</span>
                    </div>
                    <p class="text-sm text-slate-700 font-light leading-relaxed">${msg.text}</p>
                    <div class="flex justify-end text-xs text-rose-400 space-x-1 items-center font-medium">
                        <i class="fa-solid fa-heart text-[10px]"></i>
                        <span>${msg.likes || 0}</span>
                    </div>
                `;
                galleryList.appendChild(card);
            });
        }

        openGalleryBtn.addEventListener('click', () => {
            renderGallery();
            galleryModal.classList.remove('opacity-0', 'pointer-events-none');
        });

        closeGalleryBtn.addEventListener('click', () => {
            galleryModal.classList.add('opacity-0', 'pointer-events-none');
        });

        galleryModal.addEventListener('click', (e) => {
            if (e.target === galleryModal) galleryModal.classList.add('opacity-0', 'pointer-events-none');
        });

        /* ----------------------------------------------------
         * 9. TOAST NOTIFICATION UTILITY
         * ---------------------------------------------------- */
        function showToast(text) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-20 left-1/2 -translate-x-1/2 z-50 glass-panel border border-sky-300 text-sky-800 px-4 py-2.5 rounded-2xl text-xs md:text-sm shadow-lg flex items-center space-x-2 transition-all duration-300 transform -translate-y-4 opacity-0 bg-white/90';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-sky-500"></i> <span>${text}</span>`;
            
            document.body.appendChild(toast);

            setTimeout(() => toast.classList.remove('-translate-y-4', 'opacity-0'), 50);
            setTimeout(() => {
                toast.classList.add('-translate-y-4', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        }
    </script>
</body>
</html>
